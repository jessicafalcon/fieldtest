# Monthly version updates. Dependabot PRs go through the same loop as any other: CI, the
# security-reviewer, then the merge gate. A workflow bump touches a guardrail, so it also
# needs the `human-approved` label; a major version bump is escalated (CLAUDE.md).
# The cooldown keeps a release out until it's a week old, so a compromised version is
# usually caught and yanked before it's ever proposed here.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
